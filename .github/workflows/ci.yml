name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CHROME_BIN: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm

      - name: Instalar (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm exec biome check .

      - name: Tests unitarios (vitest)
        run: pnpm test

      - name: Tests web (karma headless)
        run: pnpm --filter @alxarafe/web exec ng test --watch=false --browsers=ChromeHeadless

      - name: Build
        run: pnpm build