<main class="shell">
  <header class="topnav">
    <a routerLink="/users">Usuarios</a>
    <label class="theme-toggle">
      <span class="muted">Tema</span>
      <select (change)="setTheme($event)">
        @for (theme of themeService.Themes; track theme.value) {
          <option [attr.value]="theme.value" [selected]="themeService.current() === theme.value">{{ theme.label }}</option>
        }
      </select>
    </label>
  </header>
  <router-outlet />
</main>
